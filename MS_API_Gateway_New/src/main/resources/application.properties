spring.application.name=MS_API_Gateway_New
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.ip-address=127.0.0.1


spring.cloud.gateway.routes[0].id=MS_Station_Service
spring.cloud.gateway.routes[0].uri=lb://MS_Station_Service
spring.cloud.gateway.routes[0].predicates[0]=Path=/stations/**

spring.cloud.gateway.routes[1].id=MS_Station_Service_02
spring.cloud.gateway.routes[1].uri=lb://MS_Station_Service_02
spring.cloud.gateway.routes[1].predicates[0]=Path=/stations2/**